name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # 纯 Python 侧：不需要硬件、不需要工具链。
  unit:
    name: unit (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # 注意：不要用 editable 安装，也不要用 pip 缓存（两者在受管环境会挂起）
      - name: Install
        run: python -m pip install --no-cache-dir ".[dev]"
      # 存量代码尚有历史 lint 告警；门禁先覆盖 workflow / CLI 新代码，
      # 全量整治另行推进，避免一次性红掉整个仓库。
      - name: Lint (workflow + CLI)
        run: >-
          python -m ruff check
          src/jlink_mcp/tools/build_workflow.py
          src/jlink_mcp/cli.py
          tests/unit/test_build_workflow.py
          tests/unit/test_cli.py
      - name: Unit tests
        run: python -m pytest tests/unit tests/mock -o addopts="" -q

  # 打包冒烟：验证 wheel 构建 + 安装 + CLI 入口可用。
  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build wheel
        run: python -m pip wheel --no-cache-dir --no-deps -w dist .
      - name: Install wheel
        run: python -m pip install --no-cache-dir dist/*.whl
      - name: CLI entrypoint
        run: jlink-ci --help
      - name: Toolchain detect (no hardware, no ARM toolchain needed)
        run: jlink-ci status --project . || true
